# Default Configuration - Development Environment
# This file contains default property values
# Override with environment variables or Maven profiles for different environments

# ============================================
# Application URL Configuration
# ============================================
url=https://www.saucedemo.com/

# ============================================
# User Credentials
# ============================================
# Standard user with full access
standardUserName=standard_user

# Locked out user (should fail login)
lockedOutUserName=locked_out_user

# Problem user (UI issues)
problemUserName=problem_user

# Performance glitch user
performanceGlitchUserName=performance_glitch_user

# User for error testing
errorUserName=error_user

# Visual user
visualUserName=visual_user

# Common password for all test users
passwordforAll=secret_sauce

# ============================================
# Notification Configuration
# ============================================
# WhatsApp number for test reports (with country code)
whatsappToNumber=+917980064700

# Email recipient for test reports
recipientEmail=royalekhya1999@gmail.com

# ============================================
# WebDriver Configuration
# ============================================
# Browser timeout in seconds
browser.timeout=30

# Element wait timeout in seconds
element.wait.timeout=10

# Page load timeout in seconds
page.load.timeout=30

# Implicit wait timeout in seconds
implicit.wait.timeout=10

# ============================================
# Test Configuration
# ============================================
# Test retry count
test.retry.count=2

# Screenshot on failure (true/false)
screenshot.on.failure=true

# Headless mode (true/false) - can be overridden with -Dheadless=true
headless=false

# ============================================
# Environment Configuration
# ============================================
# Environment name (dev, staging, prod)
environment=dev

# API base URL (if testing APIs)
api.base.url=https://api.saucedemo.com

# ============================================
# Logging Configuration
# ============================================
# Log level (DEBUG, INFO, WARN, ERROR)
log.level=INFO

# ============================================
# Report Configuration
# ============================================
# Report directory
report.dir=target/reports

# Screenshot directory
screenshot.dir=target/screenshots

# ============================================
# Email Configuration (for test report sending)
# Note: Use environment variables for sensitive data
# EMAIL_USERNAME - Gmail address
# EMAIL_PASSWORD - Gmail app password
# ============================================

# ============================================
# Twilio Configuration (for WhatsApp notifications)
# Note: Use environment variables for sensitive data
# TWILIO_ACCOUNT_SID - Twilio account SID
# TWILIO_AUTH_TOKEN - Twilio auth token
# ============================================
